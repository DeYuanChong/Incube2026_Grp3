services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: defects
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d defects"]
      interval: 3s
      timeout: 3s
      retries: 10

  gateway:
    build: services/gateway
    ports: ["8000:8000"]
    environment:
      REPORTING_URL: http://reporting:8001
      TRIAGE_URL: http://triage:8002
      FIXVERIFY_URL: http://fixverify:8003
      NOTIFICATION_URL: http://notification:8004
    depends_on: [reporting, triage, fixverify, notification]

  reporting:
    build: services/reporting
    ports: ["8001:8001"]
    env_file: .env
    environment:
      GATEWAY_URL: http://gateway:8000
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/defects
    depends_on:
      postgres: { condition: service_healthy }

  triage:
    build: services/triage
    ports: ["8002:8002"]
    env_file: .env
    environment:
      GATEWAY_URL: http://gateway:8000
      REPORTING_URL: http://reporting:8001
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/defects
    depends_on:
      postgres: { condition: service_healthy }

  fixverify:
    build: services/fixverify
    ports: ["8003:8003"]
    env_file: .env
    environment:
      GATEWAY_URL: http://gateway:8000
      REPORTING_URL: http://reporting:8001
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/defects
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      postgres: { condition: service_healthy }

  notification:
    build: services/notification
    ports: ["8004:8004"]
    environment:
      GATEWAY_URL: http://gateway:8000
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/defects
    depends_on:
      postgres: { condition: service_healthy }

  frontend:
    build: frontend
    ports: ["5173:5173"]
    environment:
      VITE_GATEWAY_URL: http://localhost:8000
    depends_on: [gateway]

volumes:
  pg-data:
  uploads:
